<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>fuge0xsol</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    body {
      background: #080810;
      color: #f4e9d5;
      font-family: 'Inter', 'Helvetica Neue', -apple-system, sans-serif;
    }

    /* ═══════════════ VIDEO BACKGROUND ═══════════════════
       Same approach as trade.xyz: full-screen video, object-fit cover
    ═══════════════════════════════════════════════════════ */
    .bg-wrap {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-color: #24344b; /* trade.xyz's base color behind video */
    }

    .bg-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      /* trade.xyz applies scale(1.1) to give a slight zoom feel */
      transform: scale(1.08);
      animation: videoZoom 20s ease-in-out infinite alternate;
    }

    @keyframes videoZoom {
      from { transform: scale(1.08); }
      to   { transform: scale(1.16); }
    }

    /* Subtle dark overlay so text is readable */
    .bg-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: rgba(8, 8, 16, 0.38);
    }

    /* ═══════════════ CONTENT ═══════════════════════════ */
    .content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }

    /* Top trademark */
    .tm {
      position: absolute;
      top: 1.8rem;
      left: 0; right: 0;
      text-align: center;
      font-family: monospace;
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      color: rgba(244, 233, 213, 0.55);
      text-transform: uppercase;
    }
    .tm span {
      display: inline-block;
      opacity: 0;
      animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Hero title */
    .hero { overflow: hidden; margin-bottom: 0.7rem; }
    .hero-name {
      display: block;
      font-family: 'Britti', 'Georgia', serif;
      font-size: clamp(3.5rem, 12vw, 9rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.5;
      color: #f4e9d5;
      opacity: 0;
      transform: translateY(100%);
      animation: heroIn 1.0s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
    }

    /* Tagline */
    .tagline-wrap { overflow: hidden; margin-bottom: 1.5rem; }
    .tagline {
      display: block;
      font-family: monospace;
      font-size: clamp(0.7rem, 1.8vw, 1rem);
      color: rgba(244, 233, 213, 0.6);
      text-transform: uppercase;
      letter-spacing: 0.18em;
      opacity: 0;
      transform: translateY(60%);
      animation: heroIn 0.85s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
    }

    /* Divider */
    .divider {
      width: 2.5rem;
      height: 1px;
      background: linear-gradient(to right, transparent, #f9bd29, transparent);
      margin-bottom: 2rem;
      opacity: 0;
      animation: fadeIn 0.8s ease 0.85s forwards;
    }

    /* Status dot */
    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-family: monospace;
      font-size: 0.72rem;
      color: rgba(244, 233, 213, 0.55);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: fadeIn 0.8s ease 1.0s forwards;
    }
    .status::before {
      content: '';
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #3ddc84;
      box-shadow: 0 0 8px #3ddc84;
      animation: dotPulse 2.2s ease-in-out infinite;
    }
    @keyframes dotPulse {
      0%,100% { opacity: 1; box-shadow: 0 0 6px #3ddc84; }
      50%      { opacity: 0.5; box-shadow: 0 0 14px #3ddc84; }
    }

    /* Bio */
    .bio {
      max-width: 460px;
      font-size: 0.93rem;
      line-height: 2.5;
      color: rgba(244, 233, 213, 0.5);
      margin-bottom: 2.5rem;
      opacity: 0;
      transform: translateY(16px);
      animation: heroIn 1.0s ease 1.1s forwards;
    }

    /* Social links */
    .links {
      display: flex;
      gap: 1.1rem;
      opacity: 0;
      animation: fadeIn 0.9s ease 1.3s forwards;
      flex-wrap: wrap;
      justify-content: center;
    }
    .links a {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      text-decoration: none;
      color: rgba(244, 233, 213, 0.65);
      font-family: monospace;
      font-size: 0.85rem;
      letter-spacing: 0.04em;
      padding: 0.6rem 1.25rem;
      border: 1px solid rgba(244, 233, 213, 0.18);
      border-radius: 0.5rem;
      background: rgba(36, 52, 75, 0.35);
      backdrop-filter: blur(12px);
      transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .links a:hover {
      color: #f4e9d5;
      border-color: #f9bd29;
      background: rgba(249, 189, 41, 0.12);
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(249, 189, 41, 0.12);
    }
    .links svg {
      width: 15px; height: 15px;
      fill: currentColor;
      flex-shrink: 0;
    }

    @keyframes heroIn {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }

    @media (max-width: 580px) {
      .links { gap: 0.7rem; }
      .links a { font-size: 0.8rem; padding: 0.55rem 1rem; }
    }
  </style>
</head>
