<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>fuge0xsol</title>
  <style>
    :root {
      --bg: #ffffff;
      --ink: #111111;
      --muted: #888888;
      --accent: #1a56e0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .card {
      max-width: 680px;
      width: 100%;
      text-align: center;
    }

    .avatar-wrap {
      margin-bottom: 2rem;
    }

    .avatar-wrap img {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
    }

    .name {
      font-size: 2.75rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 0.5rem;
    }

    .title {
      font-size: 1.25rem;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 2.5rem;
    }

    .bio {
      font-size: 1.25rem;
      line-height: 1.8;
      color: #444;
      max-width: 520px;
      margin: 0 auto 2.5rem;
    }

    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
      margin-bottom: 2.5rem;
    }

    .skill {
      background: var(--ink);
      color: #fff;
      padding: 0.6rem 1.4rem;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: 500;
    }

    .links {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
    }

    .link {
      background: var(--ink);
      color: #fff;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      padding: 0.8rem 2rem;
      border-radius: 4px;
      transition: background 0.2s;
      display: inline-block;
    }

    .link:hover {
      background: var(--accent);
    }

    @media (max-width: 480px) {
      .name { font-size: 2rem; }
      .bio { font-size: 1.1rem; }
      .link { padding: 0.7rem 1.5rem; font-size: 0.95rem; }
      .skill { font-size: 0.9rem; padding: 0.5rem 1.1rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .link { transition: none; }
    }
  </style>
