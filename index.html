<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>fuge0xsol</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    body {
      background: #0a1120;
      color: #f4e9d5;
      font-family: 'Inter', 'Helvetica Neue', -apple-system, sans-serif;
    }

    /* ═══════════════ WEBGL SHADER BACKGROUND ═══════════════
       GPU realtime fluid — zero network requests, ~10KB total */
    #bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* CSS fallback (used only if WebGL unavailable) */
    .bg-fallback {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 80% 60% at 30% 40%, rgba(36, 52, 75, 0.9), transparent 70%),
        radial-gradient(ellipse 60% 50% at 70% 65%, rgba(249, 189, 41, 0.10), transparent 70%),
        #0a1120;
      animation: fallbackDrift 18s ease-in-out infinite alternate;
    }
    @keyframes fallbackDrift {
      from { background-position: 0% 0%, 100% 100%, 0 0; }
      to   { background-position: 100% 50%, 0% 0%, 0 0; }
    }

    /* Subtle vignette so text stays readable over bright flow areas */
    .bg-vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 45%, rgba(5, 8, 16, 0.55) 100%);
    }

    /* ═══════════════ CONTENT ═══════════════════════════ */
    .content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }

    /* Top trademark */
    .tm {
      position: absolute;
      top: 1.8rem;
      left: 0; right: 0;
      text-align: center;
      font-family: monospace;
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      color: rgba(244, 233, 213, 0.55);
      text-transform: uppercase;
    }
    .tm span {
      display: inline-block;
      opacity: 0;
      animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Hero title */
    .hero { overflow: hidden; margin-bottom: 0.7rem; }
    .hero-name {
      display: block;
      font-family: 'Britti', 'Georgia', serif;
      font-size: clamp(3.5rem, 12vw, 9rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.5;
      color: #f4e9d5;
      opacity: 0;
      transform: translateY(100%);
      animation: heroIn 1.0s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
    }

    /* Tagline */
    .tagline-wrap { overflow: hidden; margin-bottom: 1.5rem; }
    .tagline {
      display: block;
      font-family: monospace;
      font-size: clamp(0.7rem, 1.8vw, 1rem);
      color: rgba(244, 233, 213, 0.6);
      text-transform: uppercase;
      letter-spacing: 0.18em;
      opacity: 0;
      transform: translateY(60%);
      animation: heroIn 0.85s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
    }

    /* Divider */
    .divider {
      width: 2.5rem;
      height: 1px;
      background: linear-gradient(to right, transparent, #f9bd29, transparent);
      margin-bottom: 2rem;
      opacity: 0;
      animation: fadeIn 0.8s ease 0.85s forwards;
    }

    /* Status dot */
    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-family: monospace;
      font-size: 0.72rem;
      color: rgba(244, 233, 213, 0.55);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: fadeIn 0.8s ease 1.0s forwards;
    }
    .status::before {
      content: '';
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #3ddc84;
      box-shadow: 0 0 8px #3ddc84;
      animation: dotPulse 2.2s ease-in-out infinite;
    }
    @keyframes dotPulse {
      0%,100% { opacity: 1; box-shadow: 0 0 6px #3ddc84; }
      50%      { opacity: 0.5; box-shadow: 0 0 14px #3ddc84; }
    }

    /* Bio */
    .bio {
      max-width: 460px;
      font-size: 0.93rem;
      line-height: 2.5;
      color: rgba(244, 233, 213, 0.5);
      margin-bottom: 2.5rem;
      opacity: 0;
      transform: translateY(16px);
      animation: heroIn 1.0s ease 1.1s forwards;
    }

    /* Social links */
    .links {
      display: flex;
      gap: 1.1rem;
      opacity: 0;
      animation: fadeIn 0.9s ease 1.3s forwards;
      flex-wrap: wrap;
      justify-content: center;
    }
    .links a {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      text-decoration: none;
      color: rgba(244, 233, 213, 0.65);
      font-family: monospace;
      font-size: 0.85rem;
      letter-spacing: 0.04em;
      padding: 0.6rem 1.25rem;
      border: 1px solid rgba(244, 233, 213, 0.18);
      border-radius: 0.5rem;
      background: rgba(36, 52, 75, 0.35);
      backdrop-filter: blur(12px);
      transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .links a:hover {
      color: #f4e9d5;
      border-color: #f9bd29;
      background: rgba(249, 189, 41, 0.12);
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(249, 189, 41, 0.12);
    }
    .links svg {
      width: 15px; height: 15px;
      fill: currentColor;
      flex-shrink: 0;
    }

    @keyframes heroIn {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }

    @media (max-width: 580px) {
      .links { gap: 0.7rem; }
      .links a { font-size: 0.8rem; padding: 0.55rem 1rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .fallback-drift, .bg-fallback { animation: none; }
    }
  </style>
</head>
<body>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('bg-canvas');
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var gl = canvas.getContext('webgl', { antialias: false, alpha: false })
        || canvas.getContext('experimental-webgl', { antialias: false, alpha: false });

  if (!gl) { enableFallback(); return; }

  // ── Shaders ──────────────────────────────────────────────
  var VERT = [
    'attribute vec2 a_pos;',
    'void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }'
  ].join('\n');

  // Domain-warped fbm flow — deep blue base with golden streams.
  var FRAG = [
    'precision mediump float;',
    'uniform vec2  u_res;',
    'uniform float u_time;',
    'uniform vec2  u_mouse;',

    // hash & value noise
    'float hash(vec2 p) {',
    '  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);',
    '}',
    'float noise(vec2 p) {',
    '  vec2 i = floor(p);',
    '  vec2 f = fract(p);',
    '  vec2 u = f * f * (3.0 - 2.0 * f);',
    '  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),',
    '             mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);',
    '}',

    // 4-octave fractal brownian motion
    'float fbm(vec2 p) {',
    '  float v = 0.0;',
    '  float a = 0.5;',
    '  mat2 rot = mat2(0.8, 0.6, -0.6, 0.8);',
    '  for (int i = 0; i < 4; i++) {',
    '    v += a * noise(p);',
    '    p = rot * p * 2.02;',
    '    a *= 0.5;',
    '  }',
    '  return v;',
    '}',

    'void main() {',
    '  vec2 uv = gl_FragCoord.xy / u_res.xy;',
    '  vec2 p = uv * vec2(u_res.x / u_res.y, 1.0);',

    // mouse parallax: gentle warp toward cursor
    '  vec2 m = u_mouse;',
    '  p += 0.08 * sin(u_time * 0.12) * vec2(1.0, 0.6);',
    '  p += 0.05 * (m - 0.5) * (1.0 - smoothstep(0.0, 1.4, distance(uv, m)));',

    // domain warping (Inigo Quilez style)
    '  float t = u_time * 0.045;',
    '  vec2 q = vec2(fbm(p * 1.4 + t), fbm(p * 1.4 + vec2(5.2, 1.3) - t));',
    '  vec2 r = vec2(fbm(p * 2.1 + 3.0 * q + vec2(1.7, 9.2) + t * 0.6),',
    '                fbm(p * 2.1 + 3.0 * q + vec2(8.3, 2.8) - t * 0.4));',
    '  float f = fbm(p * 1.8 + 2.5 * r);',

    // palette: deep navy → steel blue → golden streams
    '  vec3 c1 = vec3(0.030, 0.055, 0.110);',  // #08 0e 1c deep navy
    '  vec3 c2 = vec3(0.130, 0.195, 0.290);',  // steel blue (#24344b family)
    '  vec3 c3 = vec3(0.976, 0.741, 0.161);',  // gold #f9bd29

    '  vec3 col = mix(c1, c2, clamp(f * f * 2.2, 0.0, 1.0));',

    // golden ridges — extract thin filaments via ridged noise (r.x≈0.5 band)
    '  float ridge = pow(max(0.0, 1.0 - abs(r.x - 0.5) * 2.4), 5.0);',
    '  float glow  = pow(f, 3.0) * 0.5;',
    '  col += c3 * (ridge * 0.35 + glow * 0.25);',

    // top-left light bias to match hero composition
    '  col *= 0.85 + 0.3 * (1.0 - uv.y) * (1.0 - uv.x * 0.5);',

    '  gl_FragColor = vec4(col, 1.0);',
    '}'
  ].join('\n');

  // ── Compile & link ───────────────────────────────────────
  function compile(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.error('shader:', gl.getShaderInfoLog(s));
      return null;
    }
    return s;
  }

  var vs = compile(gl.VERTEX_SHADER, VERT);
  var fs = compile(gl.FRAGMENT_SHADER, FRAG);
  if (!vs || !fs) { enableFallback(); return; }

  var prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { enableFallback(); return; }
  gl.useProgram(prog);

  // fullscreen triangle
  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(prog, 'a_pos');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  var uRes = gl.getUniformLocation(prog, 'u_res');
  var uTime = gl.getUniformLocation(prog, 'u_time');
  var uMouse = gl.getUniformLocation(prog, 'u_mouse');

  // ── Resize (DPR capped for perf) ─────────────────────────
  var mouse = { x: 0.5, y: 0.5, tx: 0.5, ty: 0.5 };

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    canvas.width = Math.floor(innerWidth * dpr);
    canvas.height = Math.floor(innerHeight * dpr);
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  window.addEventListener('resize', resize);
  resize();

  // ── Mouse (lerped parallax) ──────────────────────────────
  window.addEventListener('pointermove', function (e) {
    mouse.tx = e.clientX / innerWidth;
    mouse.ty = 1.0 - e.clientY / innerHeight;
  }, { passive: true });

  // ── Render loop ──────────────────────────────────────────
  var start = performance.now();
  var running = true;

  document.addEventListener('visibilitychange', function () {
    running = !document.hidden;
    if (running) requestAnimationFrame(frame);
  });

  function frame(now) {
    if (!running) return;
    // lerp mouse for smooth drift
    mouse.x += (mouse.tx - mouse.x) * 0.04;
    mouse.y += (mouse.ty - mouse.y) * 0.04;

    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.uniform1f(uTime, reduced ? 40.0 : (now - start) / 1000);
    gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ── CSS fallback if WebGL fails ──────────────────────────
  function enableFallback() {
    if (!document.querySelector('.bg-fallback')) {
      var d = document.createElement('div');
      d.className = 'bg-fallback';
      document.body.insertBefore(d, document.body.firstChild);
    }
    if (canvas) canvas.style.display = 'none';
  }
})();
</script>
